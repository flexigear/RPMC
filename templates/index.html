<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>RPMC</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #1a1a2e;
  color: #eee;
  min-height: 100vh;
  padding: 16px;
  padding-top: env(safe-area-inset-top, 16px);
}
h1 {
  text-align: center;
  font-size: 20px;
  margin-bottom: 20px;
  color: #e94560;
}

/* Control Buttons */
.controls {
  display: flex;
  gap: 12px;
  margin-bottom: 24px;
}
.controls button {
  flex: 1;
  padding: 16px 0;
  border: none;
  border-radius: 12px;
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  color: #fff;
}
.controls button:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}
.controls button:active:not(:disabled) {
  transform: scale(0.95);
}
#btn-on { background: #00b894; }
#btn-on:hover:not(:disabled) { background: #00a381; }
#btn-off { background: #e17055; }
#btn-off:hover:not(:disabled) { background: #c9604b; }
#btn-restart { background: #6c5ce7; }
#btn-restart:hover:not(:disabled) { background: #5a4bd1; }

/* Add PC Form */
.add-form {
  background: #16213e;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 20px;
}
.add-form .row {
  display: flex;
  gap: 8px;
  margin-bottom: 8px;
}
.add-form .row:last-child { margin-bottom: 0; }
.add-form input {
  flex: 1;
  padding: 10px 12px;
  border: 1px solid #333;
  border-radius: 8px;
  background: #0f3460;
  color: #eee;
  font-size: 14px;
  outline: none;
}
.add-form input::placeholder { color: #666; }
.add-form input:focus { border-color: #e94560; }
#btn-add {
  padding: 10px 20px;
  background: #e94560;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
}
#btn-add:active { transform: scale(0.95); }

/* PC List */
.pc-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.pc-item {
  display: flex;
  align-items: center;
  background: #16213e;
  border: 2px solid transparent;
  border-radius: 12px;
  padding: 14px 16px;
  cursor: pointer;
  transition: all 0.2s;
}
.pc-item:active { transform: scale(0.98); }
.pc-item.selected {
  border-color: #e94560;
  background: #1a1a40;
}
.pc-info {
  flex: 1;
}
.pc-ip {
  font-size: 16px;
  font-weight: 600;
}
.pc-mac {
  font-size: 12px;
  color: #888;
  margin-top: 2px;
}
.pc-delete {
  width: 36px;
  height: 36px;
  border: none;
  background: none;
  color: #888;
  font-size: 20px;
  cursor: pointer;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.pc-delete:hover { color: #e94560; background: rgba(233,69,96,0.1); }

/* Toast */
.toast {
  position: fixed;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  padding: 12px 24px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 500;
  opacity: 0;
  transition: all 0.3s;
  z-index: 100;
  max-width: 90%;
  text-align: center;
}
.toast.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}
.toast.success { background: #00b894; color: #fff; }
.toast.error { background: #e17055; color: #fff; }

/* Loading overlay */
.loading {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 50;
}
.loading.show { display: flex; }
.spinner {
  width: 40px; height: 40px;
  border: 4px solid #333;
  border-top-color: #e94560;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.empty-hint {
  text-align: center;
  color: #555;
  padding: 40px 0;
  font-size: 14px;
}
</style>
</head>
<body>

<h1>RPMC</h1>

<div class="controls">
  <button id="btn-on" disabled>ON</button>
  <button id="btn-off" disabled>OFF</button>
  <button id="btn-restart" disabled>RESTART</button>
</div>

<div class="add-form">
  <div class="row">
    <input type="text" id="input-ip" placeholder="IP (e.g. 192.168.1.100)" inputmode="decimal">
    <button id="btn-add">+</button>
  </div>
  <div class="row">
    <input type="text" id="input-user" placeholder="Username" autocomplete="username">
    <input type="password" id="input-pass" placeholder="Password" autocomplete="current-password">
  </div>
  <div class="row">
    <input type="text" id="input-mac" placeholder="MAC (optional, auto-detect)">
  </div>
</div>

<div class="pc-list" id="pc-list">
  <div class="empty-hint">No PC added yet</div>
</div>

<div class="toast" id="toast"></div>
<div class="loading" id="loading"><div class="spinner"></div></div>

<script>
let pcs = [];
let selectedIp = null;

const $ = id => document.getElementById(id);

function showToast(msg, type = 'success') {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast ' + type + ' show';
  setTimeout(() => t.classList.remove('show'), 2500);
}

function setLoading(on) {
  $('loading').classList.toggle('show', on);
}

function updateButtons() {
  const has = !!selectedIp;
  $('btn-on').disabled = !has;
  $('btn-off').disabled = !has;
  $('btn-restart').disabled = !has;
}

function renderList() {
  const list = $('pc-list');
  if (pcs.length === 0) {
    list.innerHTML = '<div class="empty-hint">No PC added yet</div>';
    selectedIp = null;
    updateButtons();
    return;
  }
  list.innerHTML = pcs.map(p => `
    <div class="pc-item ${p.ip === selectedIp ? 'selected' : ''}" data-ip="${p.ip}">
      <div class="pc-info" onclick="selectPC('${p.ip}')">
        <div class="pc-ip">${p.ip}</div>
        <div class="pc-mac">${p.mac || 'MAC unknown'}</div>
      </div>
      <button class="pc-delete" onclick="deletePC('${p.ip}')" title="Delete">&#128465;</button>
    </div>
  `).join('');
  updateButtons();
}

async function loadPCs() {
  try {
    const res = await fetch('/api/pcs');
    pcs = await res.json();
    renderList();
  } catch (e) {
    showToast('Failed to load PC list', 'error');
  }
}

function selectPC(ip) {
  selectedIp = selectedIp === ip ? null : ip;
  renderList();
}

async function addPC() {
  const ip = $('input-ip').value.trim();
  const username = $('input-user').value.trim();
  const password = $('input-pass').value;
  const mac = $('input-mac').value.trim();

  if (!ip) { showToast('Please enter IP', 'error'); return; }
  if (!username || !password) { showToast('Please enter username and password', 'error'); return; }

  setLoading(true);
  try {
    const res = await fetch('/api/pcs', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ip, mac, username, password })
    });
    const data = await res.json();
    if (!res.ok) { showToast(data.error, 'error'); return; }
    $('input-ip').value = '';
    $('input-user').value = '';
    $('input-pass').value = '';
    $('input-mac').value = '';
    showToast(`Added ${ip}`);
    await loadPCs();
    selectedIp = ip;
    renderList();
  } catch (e) {
    showToast('Failed to add PC', 'error');
  } finally {
    setLoading(false);
  }
}

async function deletePC(ip) {
  if (!confirm(`Delete ${ip}?`)) return;
  setLoading(true);
  try {
    await fetch(`/api/pcs/${ip}`, { method: 'DELETE' });
    if (selectedIp === ip) selectedIp = null;
    showToast(`Deleted ${ip}`);
    await loadPCs();
  } catch (e) {
    showToast('Failed to delete', 'error');
  } finally {
    setLoading(false);
  }
}

async function sendAction(action) {
  if (!selectedIp) return;
  setLoading(true);
  try {
    const res = await fetch(`/api/${action}/${selectedIp}`, { method: 'POST' });
    const data = await res.json();
    if (res.ok) {
      showToast(data.message);
    } else {
      showToast(data.error, 'error');
    }
  } catch (e) {
    showToast('Request failed', 'error');
  } finally {
    setLoading(false);
  }
}

$('btn-add').addEventListener('click', addPC);
$('btn-on').addEventListener('click', () => sendAction('wake'));
$('btn-off').addEventListener('click', () => sendAction('shutdown'));
$('btn-restart').addEventListener('click', () => sendAction('restart'));

// Enter key on IP input
$('input-ip').addEventListener('keydown', e => {
  if (e.key === 'Enter') $('input-user').focus();
});
$('input-pass').addEventListener('keydown', e => {
  if (e.key === 'Enter') addPC();
});

loadPCs();
</script>
</body>
</html>
